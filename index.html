<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Deer Sticker Tester</title>

<style>
body {
  font-family: Arial, sans-serif;
  text-align: center;
  margin: 0;
  padding: 20px;
  background: #f2f2f2;
}

h1 {
  font-size: 26px;
}

.stage {
  width: 100%;
  max-width: 500px;
  height: 420px;
  margin: 20px auto;
  position: relative;
  overflow: hidden;
  border: 2px dashed #888;
  background: transparent;
}

#character {
  display: none;
  position: absolute;
  width: 180px;
  max-height: 380px;
  object-fit: contain;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
}

button, input {
  margin: 6px;
  padding: 12px 16px;
  font-size: 16px;
}

.walk {
  animation: walk 4s linear infinite;
}

.run {
  animation: run 1.8s linear infinite;
}

.stand {
  animation: stand 1.4s ease-in-out infinite;
}

.scream {
  animation: scream 0.15s linear infinite;
}

@keyframes walk {
  0% {
    left: -20%;
    transform: translateX(-50%) translateY(0) rotate(-2deg);
  }
  25% {
    transform: translateX(-50%) translateY(-8px) rotate(2deg);
  }
  50% {
    transform: translateX(-50%) translateY(0) rotate(-2deg);
  }
  75% {
    transform: translateX(-50%) translateY(-8px) rotate(2deg);
  }
  100% {
    left: 120%;
    transform: translateX(-50%) translateY(0) rotate(-2deg);
  }
}

@keyframes run {
  0% {
    left: -20%;
    transform: translateX(-50%) translateY(0) rotate(-5deg);
  }
  50% {
    transform: translateX(-50%) translateY(-15px) rotate(5deg);
  }
  100% {
    left: 120%;
    transform: translateX(-50%) translateY(0) rotate(-5deg);
  }
}

@keyframes stand {
  0%, 100% {
    transform: translateX(-50%) translateY(0);
  }
  50% {
    transform: translateX(-50%) translateY(-5px);
  }
}

@keyframes scream {
  0% {
    transform: translateX(-50%) rotate(-4deg) scale(1);
  }
  50% {
    transform: translateX(-50%) rotate(4deg) scale(1.05);
  }
  100% {
    transform: translateX(-50%) rotate(-4deg) scale(1);
  }
}
</style>
</head>

<body>

<h1>🦌 Doctor Deer Sticker Tester</h1>

<p>Choose your character picture:</p>

<input type="file" id="upload" accept="image/*">

<div class="stage">
  <img id="character">
</div>

<div>
  <button onclick="animateCharacter('walk')">🚶 Walking</button>
  <button onclick="animateCharacter('run')">🏃 Running</button>
  <button onclick="animateCharacter('stand')">🧍 Standing</button>
  <button onclick="animateCharacter('scream')">😱 Screaming</button>
  <button onclick="stopAnimation()">⏹ Stop</button>
</div>

<script>
const upload = document.getElementById("upload");
const character = document.getElementById("character");

upload.addEventListener("change", function(event) {
  const file = event.target.files[0];

  if (!file) return;

  const reader = new FileReader();

  reader.onload = function(e) {
    character.src = e.target.result;
    character.style.display = "block";
  };

  reader.readAsDataURL(file);
});

function animateCharacter(type) {
  character.className = "";
  void character.offsetWidth;
  character.classList.add(type);
}

function stopAnimation() {
  character.className = "";
  character.style.left = "50%";
  character.style.transform = "translateX(-50%)";
}
</script>

</body>
</html>
